<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="doorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="50%" style="stop-color:#A0522D"/>
      <stop offset="100%" style="stop-color:#654321"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#696969"/>
      <stop offset="100%" style="stop-color:#2F2F2F"/>
    </linearGradient>
    <radialGradient id="lockGrad" cx="30%" cy="30%" r="80%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </radialGradient>
  </defs>

  <!-- Door frame -->
  <rect x="4" y="2" width="24" height="28" fill="url(#frameGrad)" stroke="#2F2F2F" stroke-width="1"/>

  <!-- Door -->
  <rect x="6" y="4" width="20" height="24" fill="url(#doorGrad)" stroke="#654321" stroke-width="1"/>

  <!-- Door panels -->
  <rect x="8" y="6" width="7" height="8" fill="none" stroke="#654321" stroke-width="1"/>
  <rect x="17" y="6" width="7" height="8" fill="none" stroke="#654321" stroke-width="1"/>
  <rect x="8" y="16" width="7" height="8" fill="none" stroke="#654321" stroke-width="1"/>
  <rect x="17" y="16" width="7" height="8" fill="none" stroke="#654321" stroke-width="1"/>

  <!-- Door handle -->
  <circle cx="22" cy="16" r="1.5" fill="url(#lockGrad)" stroke="#B8860B" stroke-width="0.5"/>

  <!-- Large magical lock -->
  <circle cx="16" cy="18" r="6" fill="url(#lockGrad)" stroke="#B8860B" stroke-width="1"/>
  <circle cx="16" cy="18" r="4" fill="none" stroke="#654321" stroke-width="1"/>

  <!-- Lock keyhole -->
  <path d="M 16 15 A 2 2 0 0 1 16 19 L 16 21 L 15 21 L 15 19 A 2 2 0 0 1 16 15 Z" fill="#654321"/>

  <!-- Magical chains -->
  <path d="M 6 12 Q 16 8 26 12" stroke="url(#lockGrad)" stroke-width="2" fill="none"/>
  <path d="M 6 20 Q 16 24 26 20" stroke="url(#lockGrad)" stroke-width="2" fill="none"/>

  <!-- Chain links -->
  <ellipse cx="10" cy="11" rx="1.5" ry="1" fill="none" stroke="url(#lockGrad)" stroke-width="1"/>
  <ellipse cx="22" cy="11" rx="1.5" ry="1" fill="none" stroke="url(#lockGrad)" stroke-width="1"/>
  <ellipse cx="10" cy="21" rx="1.5" ry="1" fill="none" stroke="url(#lockGrad)" stroke-width="1"/>
  <ellipse cx="22" cy="21" rx="1.5" ry="1" fill="none" stroke="url(#lockGrad)" stroke-width="1"/>

  <!-- Magical runes on lock -->
  <path d="M 14 16 L 16 14 L 18 16" stroke="#654321" stroke-width="1" fill="none"/>
  <path d="M 14 20 L 16 22 L 18 20" stroke="#654321" stroke-width="1" fill="none"/>

  <!-- Warning glow -->
  <circle cx="16" cy="18" r="8" stroke="#FF6347" stroke-width="1" fill="none" opacity="0.5"/>
</svg>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stoneRuneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#696969"/>
      <stop offset="50%" style="stop-color:#A9A9A9"/>
      <stop offset="100%" style="stop-color:#2F2F2F"/>
    </linearGradient>
    <linearGradient id="runeGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4169E1"/>
      <stop offset="50%" style="stop-color:#6495ED"/>
      <stop offset="100%" style="stop-color:#191970"/>
    </linearGradient>
    <radialGradient id="magicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4169E1" stop-opacity="0.8"/>
      <stop offset="100%" style="stop-color:#4169E1" stop-opacity="0.2"/>
    </radialGradient>
  </defs>

  <!-- Magical glow background -->
  <circle cx="16" cy="16" r="14" fill="url(#magicGlow)"/>

  <!-- Stone platform -->
  <circle cx="16" cy="16" r="12" fill="url(#stoneRuneGrad)" stroke="#2F2F2F" stroke-width="1"/>

  <!-- Ancient rune symbol -->
  <g transform="translate(16,16)">
    <!-- Central circle -->
    <circle cx="0" cy="0" r="8" stroke="url(#runeGlowGrad)" stroke-width="2" fill="none"/>

    <!-- Inner triangular pattern -->
    <path d="M 0 -5 L 4 3 L -4 3 Z" stroke="url(#runeGlowGrad)" stroke-width="1.5" fill="none"/>

    <!-- Outer directional marks -->
    <path d="M 0 -10 L 0 -8" stroke="url(#runeGlowGrad)" stroke-width="2"/>
    <path d="M 7 -7 L 6 -6" stroke="url(#runeGlowGrad)" stroke-width="2"/>
    <path d="M 10 0 L 8 0" stroke="url(#runeGlowGrad)" stroke-width="2"/>
    <path d="M 7 7 L 6 6" stroke="url(#runeGlowGrad)" stroke-width="2"/>
    <path d="M 0 10 L 0 8" stroke="url(#runeGlowGrad)" stroke-width="2"/>
    <path d="M -7 7 L -6 6" stroke="url(#runeGlowGrad)" stroke-width="2"/>
    <path d="M -10 0 L -8 0" stroke="url(#runeGlowGrad)" stroke-width="2"/>
    <path d="M -7 -7 L -6 -6" stroke="url(#runeGlowGrad)" stroke-width="2"/>

    <!-- Central dot -->
    <circle cx="0" cy="0" r="1" fill="url(#runeGlowGrad)"/>
  </g>

  <!-- Ancient script around the edge -->
  <g transform="rotate(0 16 16)">
    <path d="M 16 4 L 17 5 L 16 6 L 15 5 Z" fill="url(#runeGlowGrad)" opacity="0.7"/>
  </g>
  <g transform="rotate(45 16 16)">
    <path d="M 16 4 L 17 5 L 16 6 L 15 5 Z" fill="url(#runeGlowGrad)" opacity="0.6"/>
  </g>
  <g transform="rotate(90 16 16)">
    <path d="M 16 4 L 17 5 L 16 6 L 15 5 Z" fill="url(#runeGlowGrad)" opacity="0.8"/>
  </g>
  <g transform="rotate(135 16 16)">
    <path d="M 16 4 L 17 5 L 16 6 L 15 5 Z" fill="url(#runeGlowGrad)" opacity="0.5"/>
  </g>
  <g transform="rotate(180 16 16)">
    <path d="M 16 4 L 17 5 L 16 6 L 15 5 Z" fill="url(#runeGlowGrad)" opacity="0.7"/>
  </g>
  <g transform="rotate(225 16 16)">
    <path d="M 16 4 L 17 5 L 16 6 L 15 5 Z" fill="url(#runeGlowGrad)" opacity="0.6"/>
  </g>
  <g transform="rotate(270 16 16)">
    <path d="M 16 4 L 17 5 L 16 6 L 15 5 Z" fill="url(#runeGlowGrad)" opacity="0.8"/>
  </g>
  <g transform="rotate(315 16 16)">
    <path d="M 16 4 L 17 5 L 16 6 L 15 5 Z" fill="url(#runeGlowGrad)" opacity="0.5"/>
  </g>
</svg>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D3D3D3"/>
      <stop offset="100%" style="stop-color:#A9A9A9"/>
    </linearGradient>
    <radialGradient id="waterGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#4682B4"/>
    </radialGradient>
    <linearGradient id="healGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF7F"/>
      <stop offset="100%" style="stop-color:#00CED1"/>
    </linearGradient>
  </defs>

  <!-- Fountain base -->
  <ellipse cx="16" cy="24" rx="12" ry="6" fill="url(#stoneGrad)" stroke="#808080" stroke-width="1"/>

  <!-- Water pool -->
  <ellipse cx="16" cy="23" rx="10" ry="4" fill="url(#waterGrad)"/>

  <!-- Fountain center pillar -->
  <rect x="13" y="18" width="6" height="8" fill="url(#stoneGrad)" stroke="#808080" stroke-width="1"/>

  <!-- Water streams -->
  <path d="M 14 18 Q 10 12 8 8" stroke="url(#healGrad)" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 16 18 Q 16 10 16 6" stroke="url(#healGrad)" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 18 18 Q 22 12 24 8" stroke="url(#healGrad)" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- Water droplets -->
  <circle cx="12" cy="14" r="1" fill="#00FF7F" opacity="0.7"/>
  <circle cx="20" cy="12" r="1" fill="#00FF7F" opacity="0.7"/>
  <circle cx="16" cy="10" r="1" fill="#00FF7F" opacity="0.7"/>

  <!-- Magical aura -->
  <circle cx="16" cy="16" r="14" stroke="url(#healGrad)" stroke-width="1" fill="none" opacity="0.3"/>
  <circle cx="16" cy="16" r="16" stroke="url(#healGrad)" stroke-width="0.5" fill="none" opacity="0.2"/>
</svg>
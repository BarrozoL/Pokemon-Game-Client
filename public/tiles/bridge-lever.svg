<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B4513"/>
      <stop offset="100%" style="stop-color:#654321"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0"/>
      <stop offset="50%" style="stop-color:#A9A9A9"/>
      <stop offset="100%" style="stop-color:#696969"/>
    </linearGradient>
    <linearGradient id="stoneBaseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A9A9A9"/>
      <stop offset="100%" style="stop-color:#696969"/>
    </linearGradient>
  </defs>

  <!-- Stone base platform -->
  <rect x="6" y="20" width="20" height="8" fill="url(#stoneBaseGrad)" stroke="#696969" stroke-width="1"/>

  <!-- Lever base mechanism -->
  <rect x="12" y="16" width="8" height="8" fill="url(#metalGrad)" stroke="#696969" stroke-width="1"/>

  <!-- Lever pivot point -->
  <circle cx="16" cy="20" r="2" fill="url(#metalGrad)" stroke="#696969" stroke-width="1"/>

  <!-- Lever arm -->
  <rect x="15" y="8" width="2" height="14" fill="url(#leverGrad)" stroke="#654321" stroke-width="1"/>

  <!-- Lever handle -->
  <circle cx="16" cy="8" r="3" fill="url(#leverGrad)" stroke="#654321" stroke-width="1"/>
  <circle cx="16" cy="8" r="2" fill="url(#metalGrad)"/>

  <!-- Gears and mechanisms -->
  <circle cx="12" cy="18" r="1.5" fill="url(#metalGrad)" stroke="#696969" stroke-width="0.5"/>
  <circle cx="20" cy="22" r="1.5" fill="url(#metalGrad)" stroke="#696969" stroke-width="0.5"/>

  <!-- Mechanical details -->
  <rect x="10" y="24" width="2" height="3" fill="#654321"/>
  <rect x="20" y="24" width="2" height="3" fill="#654321"/>

  <!-- Interaction sparkles -->
  <path d="M 8 12 L 9 14 L 11 13 L 9 15 L 8 17 L 7 15 L 5 13 L 7 14 Z" fill="#FFD700" opacity="0.6"/>
  <path d="M 24 10 L 25 11 L 26 10 L 25 12 L 24 13 L 23 12 L 22 10 L 23 11 Z" fill="#FFD700" opacity="0.4"/>

  <!-- Warning/activation indicator -->
  <rect x="13" y="4" width="6" height="2" fill="#FF6347" opacity="0.8"/>
</svg>